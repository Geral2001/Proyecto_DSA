<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Detalle por departamento · Demo local</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="/static/style.css" rel="stylesheet" />
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="title">PÁGINA 3 · DETALLE POR DEPARTAMENTO</div>
    <div class="filters">
      <label>Año:&nbsp;<input id="year-input" type="number" min="2016" max="2030" value="{{ default_year }}"/></label>
      <label>Departamento:&nbsp;<select id="dpto-select"></select></label>
      <button id="btn-apply">Aplicar</button>
      <a class="link" href="/">Inicio</a>
      <a class="link" href="/simulacion">Simulación</a>
    </div>
  </header>

  <main class="grid" style="grid-template-areas:
    'kpi kpi kpi'
    'line bars bars';
    grid-template-columns: 1.2fr 1fr 1fr;">
    <section class="kpis" style="grid-area:kpi">
      <div class="kpi-card"><div class="kpi-value" id="k1">—</div><div class="kpi-label">KPI: Tasa base (x100k)</div></div>
      <div class="kpi-card"><div class="kpi-value" id="k2">—</div><div class="kpi-label">KPI: Tasa proyectada (x100k)</div></div>
      <div class="kpi-card"><div class="kpi-value" id="k3">—</div><div class="kpi-label">KPI: Muertes evitables</div></div>
    </section>

    <section class="panel" style="grid-area:line">
      <h3>Histórico 5–8 años + proyección 12 meses</h3>
      <div id="line"></div>
    </section>

    <section class="panel" style="grid-area:bars">
      <h3>Contribución de factores (Δ tasa)</h3>
      <div id="bars"></div>
    </section>
  </main>

  <script>
    async function loadDeptos(){
      const d = await fetch("/api/deptos").then(r=>r.json());
      const sel = document.getElementById("dpto-select");
      sel.innerHTML = d.deptos.map(x=>`<option>${x}</option>`).join("");
      sel.value = "Bogotá D.C.";
    }

    async function loadDetalle(){
      const year = document.getElementById("year-input").value;
      const dpto = document.getElementById("dpto-select").value;
      const data = await fetch(`/api/detalle?year=${year}&dpto=${encodeURIComponent(dpto)}`).then(r=>r.json());

      const elK1 = document.getElementById("k1");
      const elK2 = document.getElementById("k2");
      const elK3 = document.getElementById("k3");
      elK1.textContent = data.kpi.tasa_base_x100k.toLocaleString("es-CO");
      elK2.textContent = data.kpi.tasa_proyectada_x100k.toLocaleString("es-CO");
      elK3.textContent = data.kpi.muertes_evitables.toLocaleString("es-CO");

      const yrs = data.serie.years;
      Plotly.newPlot("line", [
        { x: yrs, y: data.serie.hist, name:"Histórico (x100k)", mode:"lines+markers" },
        { x: yrs, y: data.serie.proj, name:"Proyección 12 m (x100k)", mode:"lines+markers" },
        { x: [yrs[yrs.length-1], yrs[yrs.length-1]],
          y:[data.serie.band_lo.at(-1), data.serie.band_hi.at(-1)],
          mode:"lines", name:"Banda", line:{dash:"dot"} }
      ], { margin:{l:40,r:10,t:10,b:40}, showlegend:true }, {displayModeBar:false});

      Plotly.newPlot("bars", [{
        x: data.contrib.labels, y: data.contrib.values,
        type:"bar",
        hovertemplate:"%{x}: %{y:.2f}<extra></extra>"
      }], { margin:{l:40,r:10,t:10,b:40} }, {displayModeBar:false});
    }

    document.getElementById("btn-apply").addEventListener("click", loadDetalle);
    (async ()=>{ await loadDeptos(); await loadDetalle(); })();
  </script>
</body>
</html>
